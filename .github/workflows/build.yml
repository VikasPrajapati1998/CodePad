name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: dist:win
          - os: macos-latest
            name: macos
            script: dist:mac
          - os: ubuntu-latest
            name: linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      # node-llama-cpp's postinstall must not build or download anything.
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The macOS runner is arm64, so npm ci skips the Intel engine package (cpu: x64 only). The Intel build needs it.
      - name: Install the Intel macOS AI engine package
        if: matrix.name == 'macos'
        run: npm install --no-save --ignore-scripts --os=darwin --cpu=x64 @node-llama-cpp/mac-x64@3.22.1

      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: codepad-${{ matrix.name }}
          if-no-files-found: error
          path: |
            installers/*/*.exe
            installers/*/*.dmg
            installers/*/*.zip
            installers/*/*.AppImage
            installers/*/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
